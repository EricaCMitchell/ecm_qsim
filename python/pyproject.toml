[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ecm_qsim"
version = "0.1.0"
description = "Tooling for the ecm_qsim simulator: circuit generators, benchmarks, analysis"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "qiskit",
]

[tool.setuptools]
packages = ["ecm_qsim"]
